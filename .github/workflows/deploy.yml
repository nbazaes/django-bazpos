name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: bazpos-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    env:
      IMAGE_BASE: ${{ github.repository }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      APP_IMAGE: ghcr.io/${{ github.repository }}:app-${{ github.event.workflow_run.head_sha }}
      NGINX_IMAGE: ghcr.io/${{ github.repository }}:nginx-${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare private runtime configuration
        env:
          BAZPOS_OCR_ENABLED: ${{ vars.BAZPOS_OCR_ENABLED }}
          BAZPOS_OCR_PROVIDER: ${{ vars.BAZPOS_OCR_PROVIDER }}
          BAZPOS_OCR_MODEL: ${{ vars.BAZPOS_OCR_MODEL }}
          BAZPOS_OCR_OPENROUTER_API_KEY: ${{ secrets.BAZPOS_OCR_OPENROUTER_API_KEY }}
          BAZPOS_OCR_GEMINI_API_KEY: ${{ secrets.BAZPOS_OCR_GEMINI_API_KEY }}
          BAZPOS_OCR_API_KEY: ${{ secrets.BAZPOS_OCR_API_KEY }}
        run: python3 ops/deploy/runtime_env.py export --environment --output .deploy/runtime-env.json --github-env "$GITHUB_ENV"

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Copy public files only. The private runtime payload travels via SSH envs.
          # MariaDB tuning is provisioned separately; its existing mount may be a directory.
          source: "compose.prod.yaml,ops/deploy/runtime_env.py,ops/deploy/check_ocr.py"
          target: ${{ secrets.COMPOSE_DIR }}

      - name: Pull images and quick-swap on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          COMPOSE_DIR: ${{ secrets.COMPOSE_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,APP_IMAGE,NGINX_IMAGE,COMPOSE_DIR,BAZPOS_RUNTIME_CONFIG_B64
          script: |
            set -eu
            cd "$COMPOSE_DIR"
            umask 077
            mkdir -p .deploy
            chmod 700 .deploy
            trap 'rm -f .deploy/runtime-env.json' EXIT
            test -n "${BAZPOS_RUNTIME_CONFIG_B64:-}" || { echo "ERROR: no se recibió la configuración privada." >&2; exit 1; }
            printf '%s' "$BAZPOS_RUNTIME_CONFIG_B64" | base64 --decode > .deploy/runtime-env.json
            chmod 600 .deploy/runtime-env.json
            command -v python3 >/dev/null || { echo "ERROR: instala Python 3 en el host del VPS." >&2; exit 1; }
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f compose.prod.yaml pull
            python3 ops/deploy/runtime_env.py apply --target .env --input .deploy/runtime-env.json
            docker compose -f compose.prod.yaml up -d --wait
            docker compose -f compose.prod.yaml exec -T app python - < ops/deploy/check_ocr.py
            docker image prune -f

      - name: Remove local private deployment payload
        if: always()
        run: rm -f .deploy/runtime-env.json
